# Bayan Platform — Production Nginx server block
# Deploy to: /etc/nginx/sites-available/edu-platform.conf
# Symlink into: /etc/nginx/sites-enabled/edu-platform.conf
# Replace DOMAIN_NAME with the actual duckdns hostname.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_NAME;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_NAME;

    # Let's Encrypt (Certbot) certificate paths
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Laravel root ---
    root /var/www/edu-platform/public;
    index index.php;

    # --- Hardened headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Disable access to sensitive dirs ---
    location ~ ^/(\.env|app|bootstrap|config|database|routes|storage|vendor|deploy)(/|$) {
        deny all;
        return 403;
    }

    # --- Static files (cacheable) ---
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage/ {
        alias /var/www/edu-platform/storage/app/public/;
        try_files $uri =404;
    }

    # --- Laravel front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        client_max_body_size 256M;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Upload limits (256MB for resources/PDFs) ---
    client_max_body_size 256M;
}